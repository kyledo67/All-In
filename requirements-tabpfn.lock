# Additional inference requirements for the TabPFN blend component.
#
# Separation follows the existing split: requirements-training.lock holds the
# JAX/Dynamax training environment, artifacts/blend_release/requirements.txt holds the
# frozen-blend inference environment, and this file holds the extra closure the TabPFN
# component needs. It is required only when predict_blend.py runs with
# --tabpfn-weight > 0; at weight 0 the import never happens and none of this is loaded.
#
# Local `tabpfn` package only. `tabpfn-client` is deliberately absent: it would post
# features to a remote API, and the competition requires offline inference.
#
# Model weights are not a pip dependency. The 28 MB v2 classifier checkpoint is cached
# at artifacts/tabpfn/checkpoints/ and read with HF_HUB_OFFLINE=1, so no network call
# is made at prediction time.
#
# Overlap note: tabpfn 2.2.1 constrains pandas below 3, so installing this file over
# artifacts/blend_release/requirements.txt moves pandas 3.1.1 -> 2.3.3, packaging
# 25.0 -> 26.3 and scikit-learn 1.6.1 (unchanged). The committed CatBoost checkpoints
# were re-verified under this resolution and reproduce their frozen predictions to
# 4.4e-16; see artifacts/tabpfn/rebuild_verification.json.
